behaviors:
  RobotBrain:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    
      curiosity:
        gamma: 0.99
        strength: 0.02 
        learning_rate: 0.0003
        network_settings:
          hidden_units: 256

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 5000000 
    time_horizon: 128   
    summary_freq: 100

  HumanBehavior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.01        
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    
      memory:
        sequence_length: 32
        memory_size: 64

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
   
      curiosity:
        gamma: 0.99
        strength: 0.01
        learning_rate: 0.0003

    keep_checkpoints: 10
    max_steps: 5000000 
    time_horizon: 64
    summary_freq: 10000

environment_parameters:
  spawn_distance_limit:
    curriculum:
      - name: Lesson0_BabyStep
        completion_criteria:
          measure: reward
          behavior: HumanBehavior
          threshold: 0.5  
          min_lesson_length: 200
        value: 5.0

      - name: Lesson1_CloseRange
        completion_criteria:
          measure: reward
          behavior: HumanBehavior
          threshold: 0.2  
          min_lesson_length: 500
        value: 15.0

      - name: Lesson2_MidRange
        completion_criteria:
          measure: reward
          behavior: HumanBehavior
          threshold: -0.1
          min_lesson_length: 1000
        value: 30.0

      - name: Lesson3_LongRange  
        completion_criteria:
          measure: reward
          behavior: HumanBehavior
          threshold: -0.4
          min_lesson_length: 1000
        value: 60.0

      - name: Lesson4_FullMap
        value: 1000.0